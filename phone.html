<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI YT Studio — телефон</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C93C14'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
body{margin:0;min-height:100vh;background:#16161A;color:#F4F3EF;font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 32px;box-sizing:border-box}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
nav a{color:#CFCBC2;text-decoration:none;padding:8px 12px;border-radius:999px;border:1px solid #3A3A42;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center}
nav a[aria-current="page"]{background:#F4F3EF;color:#16161A;border-color:#F4F3EF}
nav a:focus-visible{outline:3px solid #2F5BEA;outline-offset:2px}
.frame{width:414px;height:868px;border-radius:44px;background:#000;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5);flex:none}
iframe{width:390px;height:844px;border:0;border-radius:32px;background:#F4F3EF;display:block}
@media (max-height:920px){.frame{transform:scale(.85);transform-origin:top center;margin-bottom:-130px}}
</style>
</head>
<body>
<nav aria-label="Экраны телефона" id="nav"></nav>
<div class="frame"><iframe id="f" title="Прототип на телефоне"></iframe></div>
<script>
var S = [['MLanding', 'Главная'], ['MApp', 'Кабинет'], ['MStudio', 'Рост'], ['MAdmin', 'Админка'], ['MStates', 'Ошибки'], ['MLegal', 'Документы']];
var cur = new URLSearchParams(location.search).get('s') || 'MLanding';
if (!S.some(function (x) { return x[0] === cur; })) cur = 'MLanding';
if (window.matchMedia('(max-width: 700px)').matches) location.replace(cur + '.dc.html');
document.getElementById('f').src = cur + '.dc.html';
document.getElementById('nav').innerHTML = '<a href="./">← Все экраны</a>' + S.map(function (x) {
  return '<a href="?s=' + x[0] + '"' + (x[0] === cur ? ' aria-current="page"' : '') + '>' + x[1] + '</a>';
}).join('');
</script>
</body>
</html>
