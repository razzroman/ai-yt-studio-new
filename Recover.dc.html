<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script data-desktop-viewport>/* «Версия для ПК» в мобильном браузере: показываем раскладку для компьютера. */if(!/Mobi|Android|iPhone|iPod/.test(navigator.userAgent)&&navigator.maxTouchPoints>0&&screen.width<=600){var v=document.querySelector('meta[name=viewport]');if(v)v.setAttribute('content','width=1280');}</script>
<title>AI YT Studio — Password reset</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}
a{color:#16161A}a:hover{color:#B8320F}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.fld{min-height:48px;padding:0 12px;border:1px solid #D9D6CE;border-radius:10px;font-size:16px;background:#fff;box-sizing:border-box;width:100%}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:#5E5B54}
:focus-visible{outline:3px solid #2F5BEA;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div lang="{{uiLang}}" style="min-height: 100vh; background: #F4F3EF; color: #16161A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="padding: 20px clamp(16px, 4vw, 40px); display: flex; justify-content: space-between; align-items: center; gap: 12px">
<a href="Landing.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<span style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7.5-4.5z" fill="#fff"></path></svg></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px">AI YT Studio</span>
</a>
<button type="button" onClick="{{toggleLang}}" aria-label="{{t.langSwitch}}" class="mono" style="min-width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D9D6CE; background: #fff; font-size: 13px">{{langLabel}}</button>
</header>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 64px">
<div style="width: 100%; max-width: 440px; background: #fff; border: 1px solid #E2DFD7; border-radius: 16px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 6px" aria-hidden="true"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="flex: 1; height: 4px; border-radius: 2px; {{d}}"></span></sc-for></div>

<sc-if value="{{isRequest}}" hint-placeholder-val="{{ true }}">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{t.reqH}}</h1>
<p class="muted" style="margin: 0; line-height: 1.5">{{t.reqP}}</p>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="remail" style="font-weight: 500; font-size: 14px">Email</label><input id="remail" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" placeholder="you@example.com" class="fld"></div>
<button type="button" onClick="{{send}}" style="min-height: 52px; border-radius: 10px; border: 0; background: {{accent}}; color: #fff; font-weight: 600; font-size: 16px">{{t.sendLink}}</button>
<a href="Landing.dc.html" style="font-size: 14px; min-height: 44px; display: flex; align-items: center; justify-content: center">{{t.backLogin}}</a>
</sc-if>

<sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
<div style="width: 56px; height: 56px; border-radius: 14px; background: #F4F3EF; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16161A" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{t.sentH}}</h1>
<p class="muted" style="margin: 0; line-height: 1.5">{{sentP}}</p>
<button type="button" onClick="{{openMail}}" style="min-height: 52px; border-radius: 10px; border: 0; background: #16161A; color: #fff; font-size: 15px">{{t.openMail}}</button>
<div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px"><button type="button" onClick="{{resend}}" style="border: 0; background: none; padding: 8px 0; font-size: 14px; text-decoration: underline; color: #16161A">{{resendLabel}}</button><button type="button" onClick="{{toRequest}}" style="border: 0; background: none; padding: 8px 0; font-size: 14px; text-decoration: underline; color: #16161A">{{t.otherEmail}}</button></div>
<span class="muted" style="font-size: 13px">{{t.spamHint}}</span>
</sc-if>

<sc-if value="{{isReset}}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{t.resetH}}</h1>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="np1" style="font-weight: 500; font-size: 14px">{{t.newPass}}</label><input id="np1" type="password" autocomplete="new-password" value="{{p1}}" onChange="{{onP1}}" class="fld"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3"><span style="font-size: 13px; {{r.st}}">{{r.mark}} {{r.label}}</span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="np2" style="font-weight: 500; font-size: 14px">{{t.repeatPass}}</label><input id="np2" type="password" autocomplete="new-password" value="{{p2}}" onChange="{{onP2}}" class="fld"></div>
<sc-if value="{{mismatch}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 13px; color: #A3300C">{{t.mismatch}}</span></sc-if>
<button type="button" onClick="{{savePass}}" style="min-height: 52px; border-radius: 10px; border: 0; font-weight: 600; font-size: 16px; {{saveSt}}">{{t.savePass}}</button>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="width: 56px; height: 56px; border-radius: 50%; background: #DDF0E8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="#0B5A45" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"></path></svg></div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{t.doneH}}</h1>
<p class="muted" style="margin: 0; line-height: 1.5">{{t.doneP}}</p>
<a href="Main.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: {{accent}}; color: #fff; text-decoration: none; font-weight: 600; font-size: 16px">{{t.toDashboard}}</a>
</sc-if>
</div>
</main>
<div role="status" aria-live="polite" style="position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: min(92vw, 560px); background: #16161A; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,0.25); transition: opacity .2s, transform .2s; {{toastSt}}">{{toastText}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C93C14","options":["#C93C14","#2F5BEA","#0F7B5F","#16161A"]},"startLang":{"editor":"enum","options":["ru","en"],"default":"ru"},"$preview":{"width":1440,"height":900}}'>
var L = {
  ru: { langSwitch: "Сменить язык на английский", reqH: "Восстановление пароля", reqP: "Укажите email, с которым регистрировались. Пришлём ссылку для нового пароля — она действует 1 час.", sendLink: "Прислать ссылку", backLogin: "Вернуться ко входу",
    sentH: "Проверьте почту", sentP1: "Если аккаунт с адресом ", sentP2: " существует, мы отправили на него ссылку.", openMail: "Открыть ссылку из письма (демо)", resend: "Отправить ещё раз", resendDone: "Письмо отправлено повторно", otherEmail: "Другой email", spamHint: "Письма нет? Проверьте папку «Спам».",
    resetH: "Новый пароль", newPass: "Новый пароль", repeatPass: "Повторите пароль", rulesList: ["Не короче 8 символов", "Есть буква и цифра", "Не совпадает с email"], mismatch: "Пароли не совпадают", savePass: "Сохранить пароль",
    doneH: "Пароль изменён", doneP: "Мы завершили остальные сеансы входа, чтобы защитить аккаунт.", toDashboard: "Перейти в кабинет" },
  en: { langSwitch: "Switch language to Russian", reqH: "Reset your password", reqP: "Enter the email you signed up with. We’ll send a link to set a new password — it works for 1 hour.", sendLink: "Send link", backLogin: "Back to log in",
    sentH: "Check your email", sentP1: "If an account with ", sentP2: " exists, we’ve sent it a link.", openMail: "Open the link from the email (demo)", resend: "Send again", resendDone: "Email sent again", otherEmail: "Different email", spamHint: "No email? Check your spam folder.",
    resetH: "New password", newPass: "New password", repeatPass: "Repeat password", rulesList: ["At least 8 characters", "Has a letter and a digit", "Not the same as your email"], mismatch: "Passwords don’t match", savePass: "Save password",
    doneH: "Password changed", doneP: "We signed out your other sessions to keep the account safe.", toDashboard: "Go to dashboard" }
};
var STEPS = ['request', 'sent', 'reset', 'done'];

var EN_FIX = [[/Сбер · свой сервер/g, 'Sber · own server'], [/Свой сервер \(GPU\)/g, 'Own server (GPU)'], [/Яндекс/g, 'Yandex'], [/Сбер/g, 'Sber']];
function enFix(v) {
  if (typeof v === 'string') { var r = v; EN_FIX.forEach(function (p) { r = r.replace(p[0], p[1]); }); return r; }
  if (Array.isArray(v)) return v.map(enFix);
  if (v && typeof v === 'object') { var o = {}; Object.keys(v).forEach(function (k) { o[k] = typeof v[k] === 'function' ? v[k] : enFix(v[k]); }); return o; }
  return v;
}
function csvHref(rows) {
  var esc = function (x) { x = String(x == null ? '' : x); return /[",;\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  return 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + rows.map(function (r) { return r.map(esc).join(';'); }).join('\r\n'));
}
function demoBuild(self, s, msgs) {
  var show = function (m) { if (self._tt) clearTimeout(self._tt); self.setState({ toast: m }); self._tt = setTimeout(function () { self.setState({ toast: '' }); }, 4000); };
  var o = {};
  Object.keys(msgs).forEach(function (k) {
    o[k] = function (e) {
      var m = msgs[k];
      if (e && e.target && e.target.files) { var n = e.target.files.length; if (!n) return; m = m.replace('{n}', n).replace('{name}', e.target.files[0].name); }
      if (k.indexOf('copy') === 0 && msgs['_' + k]) { try { navigator.clipboard.writeText(msgs['_' + k]); } catch (er) {} }
      show(m);
    };
  });
  return { demo: o, toastText: s.toast || '', toastSt: s.toast ? 'opacity:1;transform:translate(-50%,0)' : 'opacity:0;transform:translate(-50%,10px);pointer-events:none' };
}
var DEMO = { ru: {}, en: {} };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: null, step: 'request', email: '', resent: false, p1: '', p2: '' }; }
  renderVals() {
    var s = this.state, lang = s.lang || this.props.startLang || 'ru';
    var v = Object.assign({}, this._rv(), demoBuild(this, s, DEMO[lang] || DEMO.ru), { uiLang: lang }, this._extra ? this._extra(lang) : {});
    return lang === 'en' ? enFix(v) : v;
  }
  _rv() {
    var s = this.state, self = this;
    var accent = this.props.accent ?? '#C93C14';
    var lang = s.lang || this.props.startLang || 'ru';
    var t = L[lang] || L.ru;
    var em = s.email || 'you@example.com';
    var ok = [s.p1.length >= 8, /[A-Za-zА-Яа-я]/.test(s.p1) && /\d/.test(s.p1), s.p1.length > 0 && s.p1 !== em];
    var allOk = ok[0] && ok[1] && ok[2] && s.p1 === s.p2;
    var si = STEPS.indexOf(s.step);
    return {
      t: t, accent: accent,
      langLabel: lang === 'ru' ? 'EN' : 'RU', toggleLang: function () { self.setState({ lang: lang === 'ru' ? 'en' : 'ru' }); },
      dots: STEPS.map(function (_, i) { return i <= si ? 'background:' + accent : 'background:#E2DFD7'; }),
      isRequest: s.step === 'request', isSent: s.step === 'sent', isReset: s.step === 'reset', isDone: s.step === 'done',
      email: s.email, onEmail: function (e) { self.setState({ email: e.target.value }); },
      send: function () { self.setState({ step: 'sent', resent: false }); },
      sentP: t.sentP1 + em + t.sentP2,
      openMail: function () { self.setState({ step: 'reset' }); },
      resend: function () { self.setState({ resent: true }); }, resendLabel: s.resent ? t.resendDone : t.resend,
      toRequest: function () { self.setState({ step: 'request' }); },
      p1: s.p1, p2: s.p2, onP1: function (e) { self.setState({ p1: e.target.value }); }, onP2: function (e) { self.setState({ p2: e.target.value }); },
      rules: t.rulesList.map(function (l, i) { return { label: l, mark: ok[i] ? '✓' : '○', st: ok[i] ? 'color:#0B5A45' : 'color:#5E5B54' }; }),
      mismatch: s.p2.length > 0 && s.p1 !== s.p2,
      saveSt: allOk ? 'background:' + accent + ';color:#fff' : 'background:#E2DFD7;color:#5E5B54',
      savePass: function () { if (allOk) self.setState({ step: 'done' }); }
    };
  }
}
</script>
</body>
</html>
