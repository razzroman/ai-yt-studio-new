<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI YT Studio — вход</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C93C14'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
<style>
.wrap{min-height:100vh;display:flex;flex-direction:column}
header{padding:20px clamp(16px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:12px}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 64px}
.box{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px}
.tabs a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;text-decoration:none;font-weight:500;color:var(--muted)}
.tabs a[aria-current="page"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.icon{width:56px;height:56px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
@media (min-width:600px){main{align-items:center}.box{padding:32px 28px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="/"><i><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7.5-4.5z" fill="#fff"/></svg></i>AI YT Studio</a>
  <button type="button" class="lang mono" id="langBtn"></button>
</header>
<main><div class="box" id="box" aria-live="polite"></div></main>
</div>
<script src="/app/common.js"></script>
<script src="/app/auth.js"></script>
</body>
</html>
