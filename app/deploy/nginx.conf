# nginx для AI YT Studio. __DOMAIN__ подставляет setup.sh; HTTPS добавляет certbot.
# Защита от перегрузки: лимиты запросов и соединений с одного адреса, короткие тайм-ауты.
# От крупных DDoS-атак это не спасает — для них нужна защита у провайдера (Timeweb, DDoS-Guard и т. п.).

limit_req_zone  $binary_remote_addr zone=aiyt_auth:10m rate=10r/m;   # вход и регистрация
limit_req_zone  $binary_remote_addr zone=aiyt_api:20m  rate=10r/s;   # API кабинета
limit_req_zone  $binary_remote_addr zone=aiyt_site:20m rate=30r/s;   # страницы и файлы
limit_conn_zone $binary_remote_addr zone=aiyt_conn:10m;
limit_req_status 429;
limit_conn_status 429;
server_tokens off;

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;
    limit_conn aiyt_conn 30;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Браузер открывает сайт только по HTTPS (после выпуска сертификата).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Исходники сервиса и служебные файлы не отдаём.
    location ~ ^/(\.git|app/(src|test|deploy|data)|README\.md|CNAME) { return 404; }

    location = /api/auth/login    { limit_req zone=aiyt_auth burst=5 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }
    location = /api/auth/register { limit_req zone=aiyt_auth burst=5 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }
    location = /api/auth/forgot   { limit_req zone=aiyt_auth burst=3 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }

    # Уведомления ЮKassa: без общего лимита. Сервис всё равно перепроверяет каждый платёж через API ЮKassa.
    location = /api/payments/webhook { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }

    location /api/ {
        limit_req zone=aiyt_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=aiyt_site burst=80 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
